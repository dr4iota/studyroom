# A base-problem setup: reads and writes only, no sync, no observed results.
# Thread t0 has two writes in flight at once; t1 reads block 0 twice.
format: setup
version: 2
id: "base-0001"
blocks: 2
sync_points: 0
init: [0, "*"]
threads:
  - id: t0
    steps:
      - {write: 0, id: w1, data: 1}
      - {write: 1, id: w2, data: "*"}
      - {done: w2}
      - {done: w1}
      - {write: 0, id: w3, data: 3}
      - {done: w3}
  - id: t1
    steps:
      - {read: 0, id: r1}
      - {done: r1}
      - {read: 0, id: r2}
      - {read: 1, id: r3}
      - {done: r2}
      - {done: r3}
