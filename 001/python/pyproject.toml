[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "abio"
version = "0.1.0"
description = "Trace analysis for asynchronous multi-threaded block I/O (Python reference implementation)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
abio = "abio.cli:main"

[tool.setuptools.packages.find]
include = ["abio*"]
